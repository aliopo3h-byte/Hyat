<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="التحصيل">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<title>التحصيل</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login-card">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M6 9h.01M18 15h.01"/></svg></div>
    <h1>نظام التحصيل</h1>
    <p>سجّل الدخول للبدء بجولة اليوم</p>
    <div class="field"><label>اسم المستخدم</label><input id="u" type="text" autocomplete="username" autocapitalize="none" dir="ltr" style="text-align:right"></div>
    <div class="field"><label>كلمة السر</label><input id="p" type="password" autocomplete="current-password" dir="ltr" style="text-align:right"></div>
    <div class="err" id="lerr"></div>
    <button class="btn block" id="lbtn" onclick="login()">دخول</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="hero">
    <div class="hero-top">
      <div><small>مرحباً</small><h1 id="who"></h1></div>
      <div class="hero-actions">
        <button class="icon-btn" onclick="flush(true)" aria-label="تحديث" id="refBtn"></button>
        <button class="icon-btn" onclick="logout()" aria-label="خروج" id="outBtn"></button>
      </div>
    </div>
    <div class="hero-stats">
      <div><small>المستلم اليوم</small><b id="hCollected">0</b></div>
      <div><small>الدفعات</small><b id="hCount">0</b></div>
      <div><small>المتبقي للتحصيل</small><b id="hLeft">0</b></div>
    </div>
  </div>
  <div class="wrap">
    <div id="banner"></div>
    <div class="search"><span id="searchIc"></span><input id="q" type="search" placeholder="ابحث بالاسم أو الرقم أو العنوان" oninput="render()"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>

<div class="sheet-bg" id="bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="/agent.js"></script>
</body>
</html>
